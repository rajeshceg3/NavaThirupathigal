<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nava Thirupathigal - A Celestial Journey</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous"/>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Lora:ital,wght@0,400;1,400&family=Noto+Sans+Tamil:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* --- Deep Cosmos Palette (Refined) --- */
            --color-bg-deep: #020617; /* Void Black */
            --color-bg-panel: rgba(15, 23, 42, 0.65); /* Ultra-thin Glass */
            --color-bg-panel-mobile: rgba(2, 6, 23, 0.95);

            --color-primary: #fbbf24; /* Amber Gold */
            --color-primary-glow: rgba(251, 191, 36, 0.6);
            --color-secondary: #818cf8; /* Indigo */

            --color-text-strong: #ffffff;
            --color-text-primary: #e2e8f0;
            --color-text-secondary: #94a3b8;
            --color-text-muted: #64748b;

            --color-border: rgba(255, 255, 255, 0.1);
            --glass-border: 1px solid rgba(255, 255, 255, 0.08);
            --glass-shine: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 60%);

            --font-heading: 'Lora', serif;
            --font-body: 'Manrope', sans-serif;
            --font-tamil: 'Noto Sans Tamil', sans-serif;

            --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-in-out-smooth: cubic-bezier(0.4, 0, 0.2, 1);

            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            --shadow-glow: 0 0 30px rgba(251, 191, 36, 0.25);
            --shadow-elevation-low: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* --- Base & Typography --- */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--color-bg-deep);
            font-family: var(--font-body);
            color: var(--color-text-primary);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* --- Animated Cosmic Background --- */
        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #0f172a 0%, #020617 100%);
            z-index: -2;
        }

        /* Dynamic Star Field */
        .stars, .stars2, .stars3 {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: -1;
            pointer-events: none;
        }

        .stars::after {
            content: " ";
            position: absolute;
            top: 2000px;
            width: 1px;
            height: 1px;
            background: transparent;
            box-shadow: 154px 346px #FFF , 643px 880px #FFF , 1802px 512px #FFF , 424px 1256px #FFF , 1276px 1475px #FFF , 856px 426px #FFF , 1532px 112px #FFF , 943px 1863px #FFF , 261px 852px #FFF , 1134px 621px #FFF , 1654px 1432px #FFF , 532px 1745px #FFF , 143px 1324px #FFF , 1892px 234px #FFF , 743px 1563px #FFF , 1324px 956px #FFF;
            animation: animStar 50s linear infinite;
        }

        .stars2::after {
            content: " ";
            position: absolute;
            top: 2000px;
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 254px 446px #FFF , 743px 980px #FFF , 1902px 612px #FFF , 524px 1356px #FFF , 1376px 1575px #FFF , 956px 526px #FFF , 1632px 212px #FFF , 1043px 1963px #FFF;
            animation: animStar 100s linear infinite;
        }

        @keyframes animStar {
            from { transform: translateY(0px); }
            to { transform: translateY(-2000px); }
        }

        /* --- Intro Screen --- */
        .intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 17, 0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            opacity: 1;
            transition: opacity 1.5s var(--ease-out-quint);
        }
        .intro-screen.hidden {
            opacity: 0;
            pointer-events: none;
            display: none;
        }
        .intro-title {
            font-family: var(--font-heading);
            font-size: 4rem;
            font-weight: 400; /* Lora looks elegant at lighter weights */
            font-style: italic;
            color: var(--color-primary);
            letter-spacing: 0.05em;
            text-align: center;
            margin: 0 2rem 1rem 2.5rem;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
            animation: text-reveal 1.5s var(--ease-out-quint) forwards;
            opacity: 0;
            transform: translateY(30px);
        }
        @keyframes text-reveal {
            to { opacity: 1; transform: translateY(0); }
        }
        .intro-subtitle {
            font-family: var(--font-body);
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-text-primary);
            font-size: 1rem;
            margin-bottom: 3.5rem;
            animation: text-reveal 1.5s var(--ease-out-quint) 0.5s forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .intro-button {
            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 800;
            color: #020617;
            background: var(--color-primary);
            border: none;
            padding: 1rem 3rem;
            border-radius: 2px; /* Sharper corners for modern look */
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            box-shadow: var(--shadow-glow);
            transition: all 0.5s var(--ease-out-quint);
            animation: text-reveal 1.5s var(--ease-out-quint) 1s forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .intro-button:hover {
            background: #fff;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.4);
            transform: translateY(18px) scale(1.02);
        }

        /* --- Main App Layout --- */
        .app-container {
            position: relative;
            height: 100vh;
            width: 100vw;
            background: #000;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        .app-container.visible {
            opacity: 1;
        }

        /* --- Map Visualization (Immersive) --- */
        .map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #map {
            width: 100%;
            height: 100%;
            background: var(--color-bg-deep);
            position: relative; /* Ensure z-index works */
            z-index: 0; /* Create stacking context */
        }

        /* Dark Mode Map Filters */
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(60%) contrast(90%) saturate(130%);
        }
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out {
            background-color: var(--color-bg-panel) !important;
            color: var(--color-text-strong) !important;
            border: var(--glass-border) !important;
            backdrop-filter: blur(10px);
        }
        .leaflet-control-zoom-in:hover,
        .leaflet-control-zoom-out:hover {
            background-color: var(--color-primary) !important;
            color: #000 !important;
        }
        .leaflet-control-attribution {
            background: rgba(0,0,0,0.5) !important;
            color: var(--color-text-secondary) !important;
        }

        /* --- Orb Marker Styles --- */
        .orb-marker {
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            /* No interaction blocking */
            pointer-events: none;
        }
        .orb-marker > * { pointer-events: auto; } /* Children clickable */

        .orb-core {
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--color-primary), 0 0 20px var(--color-primary);
            position: relative;
            transition: transform 0.3s var(--ease-out-quint);
        }
        .orb-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 1px solid var(--color-primary);
            border-radius: 50%;
            opacity: 0.5;
            animation: pulse-ring 3s infinite;
        }
        .orb-marker.active .orb-core {
            transform: scale(1.5);
            background: var(--color-primary);
            box-shadow: 0 0 30px var(--color-primary), 0 0 60px var(--color-primary);
        }
        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; border-width: 2px; }
            100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; border-width: 0px; }
        }

        /* Tooltip Style */
        .marker-tooltip {
            background: var(--color-bg-panel);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: var(--glass-border);
            color: var(--color-text-strong);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-family: var(--font-body);
            font-size: 0.9rem;
            box-shadow: var(--shadow-glass);
        }
        .leaflet-tooltip-left::before { border-left-color: var(--color-bg-panel); }
        .leaflet-tooltip-right::before { border-right-color: var(--color-bg-panel); }

        /* --- Desktop Floating Sidebar --- */
        .nav-panel {
            position: absolute;
            top: 2rem;
            left: 2rem;
            width: 400px;
            height: calc(100vh - 4rem);
            background: var(--color-bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: var(--glass-border);
            border-radius: 16px;
            padding: 2rem 0;
            overflow-y: auto;
            z-index: 100;
            box-shadow: var(--shadow-glass);
            scrollbar-width: thin;
            scrollbar-color: var(--color-primary) transparent;
        }
        .nav-panel::-webkit-scrollbar { width: 4px; }
        .nav-panel::-webkit-scrollbar-thumb { background: var(--color-primary); border-radius: 4px; }

        .nav-header {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            color: var(--color-primary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .temple-list {
            display: flex;
            flex-direction: column;
            padding: 0 1.5rem;
            gap: 0.8rem;
        }

        /* Desktop List Item Style */
        .temple-item {
            /* --- Button Reset --- */
            border: none;
            background: transparent;
            font: inherit;
            color: inherit;
            text-align: inherit;
            padding: 0;
            margin: 0;
            width: 100%;
            -webkit-appearance: none;
            appearance: none;

            /* --- Original Styles --- */
            display: grid;
            grid-template-columns: 60px 1fr 4px;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            /* margin-bottom replaced by gap in parent */
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s var(--ease-out-quint);
            position: relative;
            overflow: hidden;
        }
        .temple-item:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
            transform: translateX(5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .temple-item.active {
            background: linear-gradient(90deg, rgba(251, 191, 36, 0.1), transparent);
            border-color: rgba(251, 191, 36, 0.3);
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.05);
        }

        /* Desktop Avatar/Thumbnail */
        .temple-card-bg {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .temple-card-bg img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .temple-item:hover .temple-card-bg img { transform: scale(1.1); }
        .temple-card-overlay { display: none; } /* Hide overlay on desktop list */

        .temple-content {
            display: flex;
            align-items: center;
        }

        .temple-index {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--color-text-muted);
            margin-right: 1rem;
            min-width: 25px;
        }
        .temple-item.active .temple-index { color: var(--color-primary); text-shadow: 0 0 10px var(--color-primary); }

        .temple-info { display: flex; flex-direction: column; }
        .temple-name-en {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 1rem;
            color: var(--color-text-strong);
            margin-bottom: 2px;
        }
        .temple-name-ta {
            font-family: var(--font-tamil);
            font-size: 0.8rem;
            color: var(--color-text-secondary);
        }

        .active-indicator {
            width: 4px;
            height: 100%;
            background: var(--color-primary);
            border-radius: 2px;
            opacity: 0;
            box-shadow: 0 0 10px var(--color-primary);
            transition: opacity 0.3s;
        }
        .temple-item.active .active-indicator { opacity: 1; }

        /* --- Info Card (Floating Glass) --- */
        .info-card {
            position: absolute;
            top: 2rem;
            right: 2rem;
            width: 420px;
            max-width: 90vw;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
            background: var(--color-bg-panel);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 16px;
            border: var(--glass-border);
            box-shadow: var(--shadow-glass);
            z-index: 100;
            transform: translateX(120%);
            transition: transform 0.8s var(--ease-out-quint), opacity 0.5s;
            opacity: 0;
            display: flex;
            flex-direction: column;
        }
        .info-card.visible {
            transform: translateX(0);
            opacity: 1;
        }

        .info-card-image {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
        }
        .info-card-content { padding: 0 2rem 2rem 2rem; margin-top: -1rem; position: relative; }

        .info-card-header { margin-bottom: 1.5rem; }
        .info-card-title {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            line-height: 1.1;
            font-weight: 400;
            color: var(--color-primary);
            text-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .info-card-subtitle-ta {
            font-family: var(--font-tamil);
            font-size: 1.1rem;
            color: var(--color-text-secondary);
            margin-top: 0.5rem;
        }

        .info-card-planet-info {
            display: inline-flex;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 0.6rem 1.2rem;
            border-radius: 50px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .planet-icon { font-size: 1.2rem; margin-right: 0.8rem; }
        .planet-text {
            font-family: var(--font-body);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--color-text-strong);
        }

        .info-card-description {
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.8;
            color: var(--color-text-primary);
            font-weight: 300;
        }

        .info-card-close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 36px;
            height: 36px;
            background: rgba(0,0,0,0.3);
            color: var(--color-text-primary);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            line-height: 1;
            transition: all 0.3s;
            z-index: 10;
        }
        .info-card-close-btn:hover {
            background: var(--color-primary);
            color: #000;
            transform: rotate(90deg);
        }

        /* --- Mobile Hyper-Optimization --- */
        @keyframes list-enter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }

            /* Mobile Navigation: Horizontal Carousel */
            .nav-panel {
                top: auto;
                bottom: 1.5rem;
                left: 1rem;
                right: 1rem;
                width: auto;
                height: auto;
                max-height: none;
                padding: 0;
                display: flex;
                flex-direction: row;
                background: transparent;
                border: none;
                overflow-x: auto;
                overflow-y: hidden;
                white-space: nowrap;
                scroll-snap-type: x mandatory;
                box-shadow: none;
                backdrop-filter: none;
                -webkit-backdrop-filter: none;
            }
            .nav-panel::-webkit-scrollbar { display: none; } /* Hide scrollbar */

            .nav-header { display: none; }

            .temple-list {
                display: flex;
                flex-direction: row;
                padding: 0 0.5rem;
                gap: 1rem;
                margin-bottom: 1rem; /* Space for scroll */
            }
            
            /* Mobile Card Style */
            .temple-item {
                display: block; /* Reset grid */
                width: 140px;
                height: 200px;
                padding: 0;
                margin: 0;
                border-radius: 16px;
                background: var(--color-bg-panel-mobile);
                scroll-snap-align: center;
                flex-shrink: 0;
                box-shadow: 0 10px 30px rgba(0,0,0,0.5);
                border: 1px solid rgba(255,255,255,0.1);
            }

            .temple-item:hover { transform: none; } /* Disable desktop hover */

            .temple-item.active {
                background: var(--color-bg-panel-mobile);
                border: 2px solid var(--color-primary);
                transform: translateY(-10px);
                box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            }

            /* Mobile Image Cover */
            .temple-card-bg {
                width: 100%;
                height: 100%;
                border-radius: 16px;
                border: none;
                position: absolute;
                top: 0; left: 0;
                z-index: 0;
            }
            .temple-card-overlay {
                display: block;
                position: absolute;
                bottom: 0; left: 0; width: 100%; height: 80%;
                background: linear-gradient(to top, rgba(0,0,0,0.95), transparent);
                z-index: 1;
                border-radius: 0 0 16px 16px;
            }

            /* Mobile Content Overlay */
            .temple-content {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 1rem;
                z-index: 2;
            }

            .temple-index {
                position: absolute;
                top: 0.8rem;
                left: 0.8rem;
                font-size: 0.9rem;
                background: rgba(0,0,0,0.6);
                padding: 2px 8px;
                border-radius: 12px;
                margin: 0;
                backdrop-filter: blur(4px);
                color: var(--color-primary);
            }
            .temple-item.active .temple-index { color: var(--color-primary); }

            .temple-info { display: flex; flex-direction: column; white-space: normal; }
            .temple-name-en {
                font-size: 0.85rem;
                line-height: 1.2;
                margin-bottom: 4px;
                text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            }
            .temple-name-ta { display: none; } /* Hide Tamil on mobile card for space */

            .active-indicator { display: none; } /* Use border instead */

            /* Mobile Info Sheet */
            .info-card {
                width: 100%;
                max-width: 100%;
                height: 85vh;
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                border-radius: 24px 24px 0 0;
                border-bottom: none;
                transform: translateY(110%);
                z-index: 200;
                background: var(--color-bg-panel-mobile);
            }
            .info-card.visible {
                transform: translateY(0);
            }
            .info-card-image { height: 250px; }
            .info-card-content { padding: 1.5rem; padding-bottom: 6rem; /* Safe area for bottom nav */ }

            /* Map Adjustments */
            .leaflet-control-zoom { display: none; }
            .leaflet-control-attribution { display: none; }

            /* --- Map Error Handling --- */
            .map-error-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(2, 6, 17, 0.8);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
                z-index: 500;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.5s ease;
            }
            .map-error-overlay.visible {
                opacity: 1;
                pointer-events: auto;
            }
            .map-error-content h3 {
                font-family: var(--font-heading);
                font-size: 1.5rem;
                color: var(--color-primary);
                margin-bottom: 1rem;
            }
            .map-error-content p {
                font-size: 1rem;
                color: var(--color-text-secondary);
                margin-bottom: 2rem;
            }
            .retry-button {
                font-family: var(--font-body);
                font-size: 0.9rem;
                font-weight: 700;
                color: var(--color-bg-deep);
                background: var(--color-secondary);
                border: none;
                padding: 0.8rem 2rem;
                border-radius: 4px;
                cursor: pointer;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                transition: all 0.3s;
            }
            .retry-button:hover {
                background: #fff;
                box-shadow: 0 0 20px rgba(255,255,255,0.3);
            }

            .intro-title { font-size: 2.2rem; margin: 0 1rem 1rem 1rem; }
            .intro-button { padding: 1rem 2rem; width: 80%; text-align: center; }
        }
    </style>
</head>
<body>
    <noscript>
        <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: #020617; color: #e2e8f0; display: flex; justify-content: center; align-items: center; text-align: center; font-family: 'Manrope', sans-serif; z-index: 10001;">
            <p style="font-size: 1.2rem; padding: 2rem;">This celestial journey requires JavaScript to navigate the stars. Please enable it in your browser settings.</p>
        </div>
    </noscript>
    <div class="background-pattern"></div>
    <div class="stars"></div>
    <div class="stars2"></div>
    
    <div class="intro-screen" id="intro-screen">
        <h1 class="intro-title">Nava Thirupathigal</h1>
        <p class="intro-subtitle">A Celestial River Journey</p>
        <button class="intro-button" id="intro-button">Begin the Journey</button>
    </div>

    <div class="app-container" id="app-container" aria-live="polite">
        <nav class="nav-panel">
            <h2 class="nav-header">The Constellation</h2>
            <div class="temple-list" id="temple-list"></div>
        </nav>
        <main class="map-container">
            <div id="map"></div>
            <div class="map-error-overlay" id="map-error-overlay">
                <div class="map-error-content">
                    <h3>Map Data Unattainable</h3>
                    <p>Could not connect to the celestial cartographers. Please check your network connection.</p>
                    <button class="retry-button" id="retry-map-button">Retry Connection</button>
                </div>
            </div>
            <div class="info-card" id="info-card" aria-live="polite">
                <button class="info-card-close-btn" id="info-card-close-btn">×</button>
                <img src="" alt="" class="info-card-image" id="info-card-image">
                <div class="info-card-content">
                    <div class="info-card-header">
                        <h3 class="info-card-title" id="info-card-title"></h3>
                        <p class="info-card-subtitle-ta" id="info-card-subtitle-ta"></p>
                    </div>
                    <div class="info-card-planet-info">
                        <span class="planet-icon" id="planet-icon"></span>
                        <span class="planet-text" id="planet-text"></span>
                    </div>
                    <p class="info-card-description" id="info-card-description"></p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- Data ---
            const templeData = [
                { id: 0, name: 'Srivaikuntam', tamilName: 'ஸ்ரீவைகுண்டம்', planet: 'Sun', planetIcon: '☀️', coords: [8.6292, 77.9042], image: 'https://images.unsplash.com/photo-1600238323590-42f42be29772?fm=jpg&q=60&w=800&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTV8fFNyaXZhaWt1bnRhbSUyMHRlbXBsZXxlbnwwfHwwfHx8MA%3D%3D', description: 'The first temple in the pilgrimage, dedicated to Lord Vishnu as Vaikunthanathan. It is associated with Surya (the Sun) and is believed to grant devotees a life free from obstacles.' },
                { id: 1, name: 'Thiruvaragunamangai', tamilName: 'திருவரகுணமங்கை', planet: 'Moon', planetIcon: '🌙', coords: [8.6419, 77.9211], image: 'https://images.unsplash.com/photo-1565195161077-f5c5f61f9ea2?fm=jpg&q=60&w=800&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aGluZHUlMjB0ZW1wbGV8ZW58MHx8MHx8fDA%3D', description: 'Known as Natham, this temple is dedicated to Lord Vijayasana Perumal. It is linked to Chandra (the Moon), and worship here is said to bestow mental peace and clarity.' },
                { id: 2, name: 'Thirupuliyangudi', tamilName: 'திருப்புளியங்குடி', planet: 'Mercury', planetIcon: '🔘', coords: [8.6483, 77.9258], image: 'https://images.unsplash.com/photo-1524443169398-9aa1ceab67d5?fm=jpg&q=60&w=800&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8aGluZHUlMjB0ZW1wbGV8ZW58MHx8MHx8fDA%3D', description: 'Worshipped as Kasinivendan Perumal, this temple is associated with Budhan (Mercury). Devotees pray here for wisdom, knowledge, and success in education and communication.' },
                { id: 3, name: 'Rettai Tirupati (North)', tamilName: 'இரட்டை திருப்பதி (வடக்கு)', planet: 'Rahu', planetIcon: '☄️', coords: [8.6654, 77.9597], image: 'https://images.unsplash.com/photo-1566300141301-ab0577dcba1c?fm=jpg&q=60&w=800&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8aGluZHUlMjB0ZW1wbGV8ZW58MHx8MHx8fDA%3D', description: 'One of the twin temples, dedicated to Aravindalochanar. It is associated with Rahu, and prayers here are believed to alleviate the malefic effects of this celestial body.' },
                { id: 4, name: 'Rettai Tirupati (South)', tamilName: 'இரட்டை திருப்பதி (தெற்கு)', planet: 'Ketu', planetIcon: '💫', coords: [8.6644, 77.9602], image: 'https://images.unsplash.com/photo-1573352763925-82bd5dfc31d1?fm=jpg&q=60&w=800&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8aGluZHUlMjB0ZW1wbGV8ZW58MHx8MHx8fDA%3D', description: 'The other twin temple, dedicated to Devapiran. It is linked to Ketu, and worship here is said to grant spiritual enlightenment and freedom from worldly bonds.' },
                { id: 5, name: 'Thirukkulanthai', tamilName: 'திருக்குளந்தை', planet: 'Saturn', planetIcon: '🪐', coords: [8.6536, 77.9458], image: 'https://images.unsplash.com/photo-1644130919109-b3376a0368e2?fm=jpg&q=60&w=800&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8aGluZHUlMjB0ZW1wbGV8ZW58MHx8MHx8fDA%3D', description: 'Known as Perunkulam, the deity here is Srinivasa Perumal. This temple is associated with Shani (Saturn), and worship is believed to mitigate hardships and grant longevity.' },
                { id: 6, name: 'Thirukolur', tamilName: 'திருக்கோளூர்', planet: 'Mars', planetIcon: '🔴', coords: [8.6834, 78.0053], image: 'https://images.unsplash.com/photo-1610901706842-5fb2c3e88dd4?fm=jpg&q=60&w=800&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fGhpbmR1JTIwdGVtcGxlfGVufDB8fDB8fHww', description: 'Home to Vaithamanidhi Perumal, this temple is associated with Angaraka (Mars). Devotees pray here to recover lost wealth and to overcome debts and financial troubles.' },
                { id: 7, name: 'Thiruperai', tamilName: 'திருப்பேரை', planet: 'Venus', planetIcon: '✨', coords: [8.6575, 77.9786], image: 'https://images.unsplash.com/photo-1632962237468-0705d7e7b534?fm=jpg&q=60&w=800&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTF8fGhpbmR1JTIwdGVtcGxlfGVufDB8fDB8fHww', description: 'Here, Lord Vishnu is Makara Nedunkuzhaikathar. The temple is associated with Shukra (Venus) and is a place to pray for happy relationships, luxury, and artistic talents.' },
                { id: 8, name: 'Alwarthirunagari', tamilName: 'ஆழ்வார்திருநகரி', planet: 'Jupiter', planetIcon: '🟡', coords: [8.6014, 77.8767], image: 'https://images.unsplash.com/photo-1642516864189-97152c4cffb2?fm=jpg&q=60&w=800&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fGhpbmR1JTIwdGVtcGxlfGVufDB8fDB8fHww', description: 'The final temple, dedicated to Adinathan. It is the birthplace of the saint Nammalvar and is linked to Guru (Jupiter), the bestower of wisdom, fortune, and divine grace.' }
            ];
            
            // --- DOM Elements ---
            const introScreen = document.getElementById('intro-screen');
            const introButton = document.getElementById('intro-button');
            const appContainer = document.getElementById('app-container');
            const templeList = document.getElementById('temple-list');
            const infoCard = document.getElementById('info-card');
            const infoCardCloseBtn = document.getElementById('info-card-close-btn');
            // ... (rest of info card elements are queried inside render function for tidiness)
            
            // --- App State & Core Variables ---
            let map;
            let markers = [];
            let templeNavItems = [];
            let activeTempleId = null; // SINGLE SOURCE OF TRUTH
            let lastFocusedElement = null;
            let tileLayer;

            // --- Core Functions ---
            
            // Centralized State Mutator: The only way to change the active temple
            function setActiveTemple(id) {
                if (id === activeTempleId) return; // Do nothing if already active

                if (id !== null) {
                    lastFocusedElement = document.activeElement;
                }

                activeTempleId = id;
                render();

                if (activeTempleId === null && lastFocusedElement) {
                    lastFocusedElement.focus();
                }
            }

            // Declarative Render Function: Updates the entire UI based on the current state
            function render() {
                // Update Nav List
                templeNavItems.forEach((item, index) => {
                    const isActive = index === activeTempleId;
                    item.classList.toggle('active', isActive);
                    if (isActive) {
                        item.setAttribute('aria-current', 'true');
                    } else {
                        item.removeAttribute('aria-current');
                    }
                });

                // Update Markers
                markers.forEach((marker, index) => {
                    marker.getElement()?.classList.toggle('active', index === activeTempleId);
                });

                if (activeTempleId !== null) {
                    const temple = templeData[activeTempleId];
                    
                    // Update and show info card
                    const imgEl = document.getElementById('info-card-image');
                    imgEl.style.display = 'block';
                    imgEl.src = temple.image;
                    imgEl.alt = `Architectural view of ${temple.name}`;
                    imgEl.onerror = function() { this.style.display = 'none'; };

                    document.getElementById('info-card-title').textContent = temple.name;
                    document.getElementById('info-card-subtitle-ta').textContent = temple.tamilName;
                    document.getElementById('planet-icon').textContent = temple.planetIcon;
                    document.getElementById('planet-text').textContent = temple.planet;
                    document.getElementById('info-card-description').textContent = temple.description;
                    infoCard.classList.add('visible');
                    
                    // Focus management
                    infoCard.addEventListener('transitionend', () => {
                        document.getElementById('info-card-close-btn').focus();
                    }, { once: true });

                    // Fly map to location
                    map.flyTo(temple.coords, 15, { animate: true, duration: 1.5 });

                } else {
                    // Hide info card if no temple is selected
                    infoCard.classList.remove('visible');
                }
            }

            function initMap() {
                const mapErrorOverlay = document.getElementById('map-error-overlay');
                map = L.map('map', { center: [8.64, 77.94], zoom: 12, zoomControl: false });
                tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    subdomains: 'abcd',
                    minZoom: 1,
                    maxZoom: 16,
                    ext: 'jpg'
                });

                tileLayer.on('tileerror', function(event) {
                    mapErrorOverlay.classList.add('visible');
                });

                tileLayer.addTo(map);
                L.control.zoom({ position: 'bottomright' }).addTo(map);
            }

            // Optimized population function
            function populateNavAndMarkers() {
                const fragment = document.createDocumentFragment();

                // Custom DivIcon for CSS-only styling (Slick & Performant)
                const customIcon = L.divIcon({
                    className: 'orb-marker',
                    html: '<div class="orb-core"></div><div class="orb-ring"></div>',
                    iconSize: [40, 40],
                    iconAnchor: [20, 20]
                });

                templeData.forEach((temple, index) => {
                    // Create Nav Item (Enhanced Structure for Cards/List)
                    const button = document.createElement('button');
                    button.className = 'temple-item';
                    button.setAttribute('aria-label', `Select ${temple.name}`);

                    // Staggered Entry Animation
                    button.style.opacity = '0';
                    button.style.animation = `list-enter 0.6s var(--ease-out-quint) ${index * 0.08 + 0.2}s forwards`;

                    // --- Secure DOM Creation (prevents XSS) ---
                    const cardBg = document.createElement('div');
                    cardBg.className = 'temple-card-bg';

                    const img = document.createElement('img');
                    img.src = temple.image;
                    img.alt = `Image of ${temple.name}`;
                    img.loading = 'lazy';
                    img.onerror = function() { this.style.display = 'none'; };
                    cardBg.appendChild(img);

                    const overlay = document.createElement('div');
                    overlay.className = 'temple-card-overlay';
                    cardBg.appendChild(overlay);

                    const content = document.createElement('div');
                    content.className = 'temple-content';

                    const indexSpan = document.createElement('span');
                    indexSpan.className = 'temple-index';
                    indexSpan.textContent = String(index + 1).padStart(2, '0');
                    content.appendChild(indexSpan);

                    const info = document.createElement('div');
                    info.className = 'temple-info';

                    const nameEn = document.createElement('span');
                    nameEn.className = 'temple-name-en';
                    nameEn.textContent = temple.name;
                    info.appendChild(nameEn);

                    const nameTa = document.createElement('span');
                    nameTa.className = 'temple-name-ta';
                    nameTa.textContent = temple.tamilName;
                    info.appendChild(nameTa);

                    content.appendChild(info);

                    const indicator = document.createElement('div');
                    indicator.className = 'active-indicator';

                    button.append(cardBg, content, indicator);
                    // --- End Secure DOM Creation ---

                    button.addEventListener('click', () => setActiveTemple(temple.id));
                    fragment.appendChild(button);

                    // Create Map Marker
                    const marker = L.marker(temple.coords, { icon: customIcon }).addTo(map);
                    marker.bindTooltip(temple.name, {
                        permanent: false,
                        direction: 'top',
                        className: 'marker-tooltip',
                        offset: [0, -20]
                    });
                    marker.on('click', () => setActiveTemple(temple.id));
                    markers.push(marker);
                });

                templeList.appendChild(fragment);
                templeNavItems = Array.from(templeList.children);
            }

            // --- Event Listeners & Initialization ---
            introButton.addEventListener('click', () => {
                introScreen.style.opacity = '0';
                appContainer.classList.add('visible');
                map.invalidateSize();

                introScreen.addEventListener('transitionend', () => {
                    introScreen.classList.add('hidden');
                }, { once: true });
            });
            
            infoCardCloseBtn.addEventListener('click', () => {
                setActiveTemple(null);
            });

            infoCard.addEventListener('keydown', handleFocusTrap);

            function handleFocusTrap(e) {
                if (e.key !== 'Tab') return;

                const focusableElements = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';
                const focusableContent = infoCard.querySelectorAll(focusableElements);
                const firstFocusable = focusableContent[0];
                const lastFocusable = focusableContent[focusableContent.length - 1];

                if (e.shiftKey) { // if shift key pressed for shift + tab combination
                    if (document.activeElement === firstFocusable) {
                        lastFocusable.focus(); // move focus to the last focusable element
                        e.preventDefault();
                    }
                } else { // if tab key is pressed
                    if (document.activeElement === lastFocusable) { // if focused has reached to last focusable element
                        firstFocusable.focus(); // move focus to the first focusable element
                        e.preventDefault();
                    }
                }
            }

            function retryMapConnection() {
                const mapErrorOverlay = document.getElementById('map-error-overlay');
                mapErrorOverlay.classList.remove('visible');
                if (tileLayer) {
                    // Re-add layer to trigger reload
                    tileLayer.remove();
                    tileLayer.addTo(map);
                }
            }

            document.getElementById('retry-map-button').addEventListener('click', retryMapConnection);

            // --- Initializer ---
            initMap();
            populateNavAndMarkers();
        });
    </script>
</body>
</html>
